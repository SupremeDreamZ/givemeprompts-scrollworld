<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10051c"><title>Dimension 404</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10051c;color:#f3eddc;font:900 14px Arial}#boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px}#boot b{display:block;color:#8dff39;font-size:18px;margin-bottom:8px}#boot small{opacity:.7}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#10051c;display:none}</style></head><body><div id="boot"><div><b id="bootTitle">LOADING DIMENSION 404</b><small id="bootStatus">VERIFYING WORLD 0/9</small></div></div><iframe id="app" allow="autoplay; fullscreen" title="Dimension 404"></iframe><script>(async()=>{const status=document.getElementById('bootStatus'),title=document.getElementById('bootTitle'),frame=document.getElementById('app');function xhr(url,attempt=1){return new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('GET',url+(url.includes('?')?'&':'?')+'cb='+Date.now()+'-'+attempt,true);x.timeout=7000;x.onload=()=>x.status>=200&&x.status<300?resolve(x.responseText):reject(new Error('HTTP '+x.status));x.onerror=()=>reject(new Error('network error'));x.ontimeout=()=>reject(new Error('timeout'));x.send()})}async function getChunk(i){let err;for(let a=1;a<=3;a++){try{return await xhr('plain'+i+'.txt',a)}catch(e){err=e;status.textContent='RETRY '+i+'/9 · '+a+'/3'}}throw new Error('plain'+i+'.txt: '+err.message)}try{const parts=[];for(let i=1;i<=9;i++){status.textContent='VERIFYING WORLD '+(i-1)+'/9';parts.push(await getChunk(i));status.textContent='VERIFYING WORLD '+i+'/9'}let h=parts.join('');h=h.replace(/assets\//g,'https://supremedreamz.github.io/givemeprompts-scrollworld/dimension404/v08/assets/');frame.srcdoc=h;let tries=0;const watch=setInterval(()=>{tries++;try{const w=frame.contentWindow;if(w&&w.__dimension404){clearInterval(watch);frame.style.display='block';document.getElementById('boot')?.remove();return}const txt=frame.contentDocument?.body?.innerText||'';if(txt.includes('WebGL is required')){clearInterval(watch);title.textContent='WEBGL REQUIRED';status.textContent='Your browser disabled WebGL for this tab. Reload Safari/Chrome and try again.';frame.style.display='block'}}catch(e){}if(tries>80){clearInterval(watch);title.textContent='ENGINE BOOT FAILED';let txt='';try{txt=frame.contentDocument?.body?.innerText||''}catch(e){}status.textContent=txt?txt.slice(0,180):'The game document loaded, but the engine did not initialize.'}},100)}catch(e){console.error(e);title.textContent='BOOT FAILED';status.textContent=String(e)}})();</script></body></html>
