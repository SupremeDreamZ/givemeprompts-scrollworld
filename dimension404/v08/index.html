<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dimension 404 // v0.8</title><body style="margin:0;background:#10051c;color:#f3eddc;font:900 14px Arial;display:grid;place-items:center;height:100vh">BOOTING DIMENSION 404…<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script><script>(async()=>{try{const b=(await Promise.all([1,2,3,4,5,6,7,8].map(i=>fetch('p'+i+'.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('missing chunk '+i+' HTTP '+r.status);return r.text()})))).join('').replace(/\s+/g,'');const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);const h=pako.ungzip(a,{to:'string'});document.open();document.write(h);document.close()}catch(e){console.error(e);document.body.style.display='block';document.body.innerHTML='<div style="padding:30px">BOOT ERROR: '+String(e)+'</div>'}})()</script>
