<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="GiveMePrompts underground prompt laboratory and playable signal-defense arcade experience.">
  <title>GiveMePrompts // Acquiring Signal</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#070707;color:#a5f27a;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    body{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 4px)}
    main{min-height:100vh;display:grid;place-items:center;padding:24px}
    section{width:min(560px,100%);border:1px solid #344036;background:#0b0e0c;padding:clamp(22px,5vw,38px);box-shadow:inset 0 0 60px #000}
    .channel{margin:0 0 10px;color:#f2a640;letter-spacing:.16em}
    h1{font-size:clamp(24px,6vw,46px);line-height:1;margin:0 0 18px;letter-spacing:-.04em}
    p{color:#c8c8bf;margin:0 0 18px}
    .track{height:6px;background:#1a211c;overflow:hidden;border:1px solid #2b342e}
    .bar{height:100%;width:8%;background:#a5f27a;transition:width .18s ease}
    small{display:block;margin-top:14px;color:#788078}
    .error{color:#f2a640;margin-top:16px}
  </style>
</head>
<body>
  <main>
    <section aria-live="polite">
      <p class="channel">OPEN CHANNEL 23</p>
      <h1>ACQUIRING UNDERGROUND LAB</h1>
      <p id="status">ROUTING SIX-PART SIGNAL</p>
      <div class="track" aria-label="Loading progress"><div class="bar" id="bar"></div></div>
      <small>The machinery is real. The loading screen merely has better manners than most software.</small>
    </section>
  </main>
  <script>
    (async()=>{
      const status=document.getElementById('status');
      const bar=document.getElementById('bar');
      try{
        if(!('DecompressionStream' in window)){
          throw new Error('This browser is too old to decode the laboratory signal. Use a current Safari, Chrome, Firefox, or Edge release.');
        }
        const urls=Array.from({length:6},(_,i)=>`./payload/part-${String(i).padStart(2,'0')}.txt`);
        const parts=[];
        for(let i=0;i<urls.length;i++){
          const response=await fetch(urls[i],{cache:'no-store'});
          if(!response.ok) throw new Error(`Signal segment ${i+1} failed with status ${response.status}.`);
          parts.push((await response.text()).trim());
          bar.style.width=`${8+((i+1)/urls.length)*72}%`;
          status.textContent=`ACQUIRED SIGNAL PART ${i+1} / ${urls.length}`;
        }
        const binary=atob(parts.join(''));
        const compressed=Uint8Array.from(binary,character=>character.charCodeAt(0));
        const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html=await new Response(stream).text();
        if(!html.startsWith('<!doctype html>')) throw new Error('Decoded signal failed integrity inspection.');
        bar.style.width='100%';
        status.textContent='SIGNAL LOCKED';
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        status.textContent='SIGNAL ACQUISITION FAILED';
        const message=document.createElement('p');
        message.className='error';
        message.textContent=error instanceof Error?error.message:String(error);
        document.querySelector('section').appendChild(message);
      }
    })();
  </script>
</body>
</html>
