<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GiveMePrompts — tap in</title>
  <meta name="description" content="Scroll to fly through the world of GiveMePrompts. JSRF energy, HDR neons on pure black." />
  <style>
    :root, .sw-root {
      --sw-bg: #000000;          /* pure black — neons burn off it */
      --sw-ink: #F4F4F4;
      --sw-ink-soft: #9aa0a6;
      --sw-accent: #00FFFF;      /* per-section accents override at runtime */
    }
    /* background audio control */
    #sw-audio-toggle {
      position: fixed; right: 16px; bottom: 16px; z-index: 60;
      width: 44px; height: 44px; border-radius: 999px;
      background: rgba(0,0,0,.55); border: 1px solid #00FFFF;
      color: #00FFFF; font-size: 18px; line-height: 42px; text-align: center;
      cursor: pointer; user-select: none; backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <audio id="sw-track" src="assets/audio/track.mp3" loop preload="auto"></audio>
  <div id="sw-audio-toggle" title="sound on/off">&#119136;</div>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'GiveMePrompts', href: '#top' },
      cta: { label: 'HIT ME UP', href: 'https://instagram.com/GiveMePrompts' },
      hint: 'scroll to fly in',
      diveScroll: 1.3,
      connScroll: 0.9,
      atmosphere: false,   // keep the void pure black
      sections: [
        {
          id: 'hero', label: 'Drop In',
          still: 'assets/stills/s1.png',
          clip: 'assets/vid/d1.mp4',
          accent: '#00FFFF',
          eyebrow: 'GIVEMPROMPTS',
          title: 'We make prompts hit different.',
          body: 'A street-level AI creative crew turning prompts into scroll-stopping worlds.',
          tags: ['JSRF', 'Vector Anime', 'HDR Neon'],
        },
        {
          id: 'flow', label: 'The Flow',
          still: 'assets/stills/s2.png',
          clip: 'assets/vid/d2.mp4',
          accent: '#FF006E',
          eyebrow: 'THE LAB',
          title: 'Prompt labs. Style vaults. Crew walls.',
          body: 'Every world starts as a spark — we engineer it into a universe.',
          tags: ['Prompt Engineering', 'Style Systems'],
        },
        {
          id: 'crew', label: 'The Crew',
          still: 'assets/stills/s3.png',
          clip: 'assets/vid/d3.mp4',
          accent: '#39FF14',
          eyebrow: 'THE CREW',
          title: 'Built by people who get it.',
          body: 'Operators, promptsmiths, and vision — tapped into the same signal.',
          tags: ['Tha WOLF', 'GiveMePrompts', 'BLAQUE'],
        },
        {
          id: 'line', label: 'The Line',
          still: 'assets/stills/s4.png',
          clip: 'assets/vid/d4.mp4',
          accent: '#8B00FF',
          eyebrow: 'THE LINE',
          title: 'Your world is one prompt away.',
          body: 'Tap in. Tell us the vision. We build the scroll-stopping reality.',
          tags: [],
          cta: { primary: { label: 'HIT ME UP', href: 'https://instagram.com/GiveMePrompts' },
                 secondary: { label: 'Back to top', href: '#top' } },
        },
      ],
      connectors: [
        'assets/vid/c12.mp4',
        'assets/vid/c23.mp4',
        'assets/vid/c34.mp4',
      ],
    });

    // Background track: start on first interaction (autoplay policy), toggle on click.
    (function () {
      var audio = document.getElementById('sw-track');
      var btn = document.getElementById('sw-audio-toggle');
      audio.volume = 0.5;
      var started = false;
      function startOnce() {
        if (started) return; started = true;
        audio.play().catch(function () {});
      }
      window.addEventListener('scroll', startOnce, { once: true, passive: true });
      window.addEventListener('pointerdown', startOnce, { once: true });
      window.addEventListener('keydown', startOnce, { once: true });
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (audio.paused) { audio.play().catch(function () {}); btn.style.opacity = '1'; }
        else { audio.pause(); btn.style.opacity = '0.45'; }
      });
    })();
  </script>
</body>
</html>
